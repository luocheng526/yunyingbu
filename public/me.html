<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人中心 · 运营部</title>
    <link rel="stylesheet" href="/shared/layout.css" />
    <style>
      .page { max-width: 720px; }
      .demo-tag {
        display: inline-block; margin: 0 0 1.25rem; padding: 0.2rem 0.65rem;
        border-radius: 999px; background: #ccfbf1; color: var(--accent-ink, #134e4a); font-size: 0.85rem;
      }
      .panel {
        background: var(--card, #fffcf7); border: 1px solid var(--line, #e7e5e4);
        border-radius: 16px; padding: 1.25rem 1.3rem 1.4rem;
        box-shadow: var(--shadow, 0 10px 30px rgba(28, 25, 23, 0.08)); margin-bottom: 1.1rem;
      }
      .panel h2 { margin: 0 0 1rem; font-size: 1.1rem; }
      label { display: block; margin: 0 0 0.85rem; font-size: 0.92rem; color: var(--muted, #57534e); }
      input {
        display: block; width: 100%; margin-top: 0.35rem; padding: 0.55rem 0.7rem;
        border: 1px solid var(--line, #e7e5e4); border-radius: 10px; font: inherit;
      }
      input[readonly] { background: #f5f5f4; color: var(--muted, #57534e); }
      .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.4rem; }
      button {
        font: inherit; border: 0; border-radius: 999px; padding: 0.55rem 1.1rem;
        background: var(--accent, #0f766e); color: #fff; cursor: pointer;
      }
      button.secondary { background: #e7e5e4; color: var(--ink, #1c1917); }
      .status { min-height: 1.4rem; margin: 0 0 1rem; font-size: 0.95rem; }
      .status.error { color: #b91c1c; }
      .status.ok { color: #047857; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="site-nav">
      <header class="site-header">
        <div class="site-header__inner">
          <a class="site-brand" href="/">运营部</a>
          <nav class="site-nav" aria-label="全站导航">
            <a href="/">首页</a>
            <a href="/data">数据中心</a>
            <a href="/shen">沈子晗运营中心</a>
            <a href="/han">韩梦凯运营中心</a>
            <a href="/people">人员管理</a>
            <a href="/releases">版本发布中心</a>
            <a href="/me" aria-current="page">个人中心</a>
          </nav>
        </div>
      </header>
    </div>
    <main class="page">
      <p class="kicker">运营部</p>
      <h1>个人中心</h1>
      <span class="demo-tag">演示环境</span>
      <p class="lead">登录后可改自己的显示名、邮箱、手机和密码。人员名册不在本页。</p>
      <p id="status" class="status" role="status"></p>

      <section id="login-panel" class="panel">
        <h2>登录</h2>
        <form id="login-form" autocomplete="on">
          <label>用户名<input id="login-username" name="username" type="text" required autocomplete="username" /></label>
          <label>密码<input id="login-password" name="password" type="password" required autocomplete="current-password" /></label>
          <div class="actions">
            <button type="submit">登录</button>
          </div>
        </form>
      </section>

      <section id="settings-panel" class="hidden">
        <div class="panel">
          <h2>账号资料</h2>
          <form id="profile-form">
            <label>用户名<input id="profile-username" name="username" type="text" readonly /></label>
            <label>显示名<input id="profile-displayName" name="displayName" type="text" autocomplete="nickname" /></label>
            <label>邮箱<input id="profile-email" name="email" type="email" autocomplete="email" /></label>
            <label>手机<input id="profile-phone" name="phone" type="tel" autocomplete="tel" /></label>
            <div class="actions">
              <button type="submit">保存资料</button>
            </div>
          </form>
        </div>
        <div class="panel">
          <h2>修改密码</h2>
          <form id="password-form" autocomplete="off">
            <label>当前密码<input id="current-password" name="currentPassword" type="password" required autocomplete="current-password" /></label>
            <label>新密码<input id="new-password" name="newPassword" type="password" required minlength="8" autocomplete="new-password" /></label>
            <label>确认新密码<input id="confirm-password" name="confirmPassword" type="password" required minlength="8" autocomplete="new-password" /></label>
            <div class="actions">
              <button type="submit">修改密码</button>
            </div>
          </form>
        </div>
        <div class="panel">
          <form id="logout-form">
            <div class="actions">
              <button type="submit" class="secondary">退出登录</button>
            </div>
          </form>
        </div>
      </section>
    </main>
    <script src="/shared/nav.js"></script>
    <script>
      (function () {
        var statusEl = document.getElementById("status");
        var loginPanel = document.getElementById("login-panel");
        var settingsPanel = document.getElementById("settings-panel");

        function setStatus(message, kind) {
          statusEl.textContent = message || "";
          statusEl.className = "status" + (kind ? " " + kind : "");
        }

        function showLogin() {
          loginPanel.classList.remove("hidden");
          settingsPanel.classList.add("hidden");
        }

        function showSettings() {
          loginPanel.classList.add("hidden");
          settingsPanel.classList.remove("hidden");
        }

        function fillProfile(user) {
          document.getElementById("profile-username").value = user.username || "";
          document.getElementById("profile-displayName").value = user.displayName || "";
          document.getElementById("profile-email").value = user.email || "";
          document.getElementById("profile-phone").value = user.phone || "";
        }

        async function api(path, options) {
          var res = await fetch(path, Object.assign({ credentials: "same-origin" }, options));
          var data = {};
          try { data = await res.json(); } catch (_err) { data = {}; }
          return { res: res, data: data };
        }

        async function refreshSession() {
          var result = await api("/api/profile/me");
          if (!result.res.ok) {
            showLogin();
            return;
          }
          fillProfile(result.data);
          showSettings();
        }

        document.getElementById("login-form").addEventListener("submit", async function (event) {
          event.preventDefault();
          var username = document.getElementById("login-username").value;
          var password = document.getElementById("login-password").value;
          var result = await api("/api/profile/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: username, password: password })
          });
          document.getElementById("login-password").value = "";
          if (!result.res.ok) {
            showLogin();
            setStatus(result.data.error || "登录失败", "error");
            return;
          }
          fillProfile(result.data.user || result.data);
          showSettings();
          setStatus("登录成功", "ok");
        });

        document.getElementById("profile-form").addEventListener("submit", async function (event) {
          event.preventDefault();
          var result = await api("/api/profile", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              displayName: document.getElementById("profile-displayName").value,
              email: document.getElementById("profile-email").value,
              phone: document.getElementById("profile-phone").value
            })
          });
          if (!result.res.ok) {
            setStatus(result.data.error || "保存失败", "error");
            return;
          }
          fillProfile(result.data);
          setStatus("资料已保存", "ok");
        });

        document.getElementById("password-form").addEventListener("submit", async function (event) {
          event.preventDefault();
          var result = await api("/api/profile/password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              currentPassword: document.getElementById("current-password").value,
              newPassword: document.getElementById("new-password").value,
              confirmPassword: document.getElementById("confirm-password").value
            })
          });
          document.getElementById("current-password").value = "";
          document.getElementById("new-password").value = "";
          document.getElementById("confirm-password").value = "";
          if (!result.res.ok) {
            setStatus(result.data.error || "改密失败", "error");
            return;
          }
          setStatus(result.data.message || "密码已更新", "ok");
        });

        document.getElementById("logout-form").addEventListener("submit", async function (event) {
          event.preventDefault();
          await api("/api/profile/logout", { method: "POST" });
          showLogin();
          setStatus("已退出登录", "ok");
        });

        refreshSession();
      })();
    </script>
  </body>
</html>
