<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>占位 · 数据中心</title>
    <link rel="stylesheet" href="/shared/layout.css" />
    <link rel="stylesheet" href="/data-pages.css" />
  </head>
  <body>
    <div id="site-nav"></div>
    <main class="xm-page">
      <p class="kicker">数据中心</p>
      <h1>占位</h1>
      <nav class="data-subnav" id="data-subnav"></nav>
      <section class="data-placeholder" id="placeholder">
        <p class="lead">此页为占位，功能尚未接入。不连接业务库。</p>
        <p class="muted" id="notice">建设中</p>
      </section>
    </main>
    <script src="/shared/nav.js"></script>
    <script src="/data-subnav.js"></script>
    <script>
      (function () {
        fetch("/api/data/placeholder", {
          credentials: "same-origin",
          headers: { Accept: "application/json" }
        })
          .then(function (res) {
            if (!res.ok) throw new Error("接口 " + res.status);
            return res.json();
          })
          .then(function (data) {
            if (data.notice) {
              document.getElementById("notice").textContent = data.notice;
            }
          })
          .catch(function () {
            document.getElementById("notice").textContent = "建设中";
          });
      })();
    </script>
  </body>
</html>
