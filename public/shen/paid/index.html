<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>付费中心 · 沈子晗运营中心</title>
    <link rel="stylesheet" href="/shared/layout.css" />
    <link rel="stylesheet" href="/shen-submenu.css" />
    <style>
      html, body { margin: 0; min-height: 100%; }
      .app-shell { display: flex; align-items: stretch; min-height: 100vh; }
      .site-sidebar, .app-shell > #site-nav, .app-shell > aside, .app-shell > .site-header {
        flex: 0 0 220px; width: 220px; box-sizing: border-box;
        background: var(--card, #fffcf7); border-right: 1px solid var(--line, #e7e5e4);
        padding: 1.15rem 0.85rem 2rem;
      }
      .site-brand { display: block; font-weight: 700; color: var(--accent-ink, #134e4a); text-decoration: none; margin: 0 0.4rem 1rem; }
      .site-nav { display: flex; flex-direction: column; gap: 0.2rem; }
      .site-nav a { color: var(--muted, #57534e); text-decoration: none; padding: 0.5rem 0.7rem; border-radius: 10px; font-size: 0.92rem; }
      .site-nav a:hover, .site-nav a[aria-current="page"] { color: var(--accent-ink, #134e4a); background: #ccfbf1; }
      .page { flex: 1; min-width: 0; padding: 2.25rem 1.5rem 3.5rem; }
      .panel {
        background: var(--card, #fffcf7); border: 1px solid var(--line, #e7e5e4);
        border-radius: 16px; box-shadow: var(--shadow, 0 10px 30px rgba(28, 25, 23, 0.08));
        padding: 1.15rem 1.2rem 1.25rem;
      }
      .empty { color: var(--muted, #57534e); margin: 0; }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div id="site-nav">
        <aside class="site-sidebar">
          <a class="site-brand" href="/">运营部</a>
          <nav class="site-nav" aria-label="全站导航">
            <a href="/">首页</a>
            <a href="/data">数据中心</a>
            <div class="shen-nav-group is-open">
              <div class="shen-nav-parent">
                <a href="/shen">沈子晗运营中心</a>
                <button type="button" class="shen-nav-arrow" aria-expanded="true" aria-label="展开或收起沈子晗子菜单">▼</button>
              </div>
              <div class="shen-nav-sub">
                <a href="/shen/product">产品中心</a>
                <a href="/shen/paid" aria-current="page">付费中心</a>
                <a href="/shen/training">培训系统</a>
                <a href="/shen/tasks">任务管理</a>
              </div>
            </div>
            <a href="/han">韩梦凯运营中心</a>
            <a href="/people">人员管理</a>
            <a href="/releases">版本发布中心</a>
            <a href="/me">个人中心</a>
          </nav>
        </aside>
      </div>
      <main class="page">
        <p class="kicker">沈子晗团队</p>
        <h1>付费中心</h1>
        <section class="panel">
          <p class="empty">内容待开发。</p>
        </section>
      </main>
    </div>
    <script src="/shared/nav.js"></script>
    <script src="/shen-submenu.js"></script>
  </body>
</html>
