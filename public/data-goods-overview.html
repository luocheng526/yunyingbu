<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品数据总揽 · 数据中心</title>
    <link rel="stylesheet" href="/shared/layout.css" />
    <link rel="stylesheet" href="/data-pages.css" />
  </head>
  <body>
    <div id="site-nav"></div>
    <main class="xm-page xm-ui-scope">
      <h1>商品数据总揽</h1>
      <nav class="data-subnav" id="data-subnav"></nav>
      <p class="lead">在售商品动销与库存。数字为占位演示。</p>
      <div id="cards" aria-label="商品总揽指标"></div>
      <div id="rows-wrap"></div>
    </main>
    <script src="/data-xm-ui.js"></script>
    <script src="/data-overview.js?v=xm-module"></script>
    <script src="/shared/nav.js"></script>
    <script src="/data-subnav.js"></script>
    <script>
      (function () {
        function paint(data, err) {
          const kit = window.XmUI;
          const ui = window.XmDataUi;
          if (!kit || !ui) {
            return;
          }
          document.getElementById("cards").innerHTML = ui.statGrid(data.cards || []);
          const rows = (data.rows || []).map(function (row) {
            return { sku: row.sku, name: row.name, sales: row.sales, stock: row.stock };
          });
          document.getElementById("rows-wrap").innerHTML = kit.ContentCard({
            title: "商品周报",
            content: err
              ? kit.EmptyState({ title: err })
              : kit.DataTable({
                  columns: [
                    { key: "sku", label: "SKU" },
                    { key: "name", label: "名称" },
                    { key: "sales", label: "周销量" },
                    { key: "stock", label: "库存" }
                  ],
                  rows: rows
                })
          });
        }
        window.XmDataUi.ready(function () {
          fetch("/api/data/goods/overview", {
            credentials: "same-origin",
            headers: { Accept: "application/json" }
          })
            .then(function (res) {
              if (!res.ok) throw new Error("接口 " + res.status);
              return res.json();
            })
            .then(function (data) {
              paint(data);
            })
            .catch(function (err) {
              paint({ cards: [], rows: [] }, err.message);
            });
        });
      })();
    </script>
  </body>
</html>
