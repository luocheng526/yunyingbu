<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>韩梦凯运营中心</title>
    <link rel="stylesheet" href="/shared/layout.css" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      .app-shell {
        display: flex;
        align-items: stretch;
        min-height: 100vh;
      }
      .site-sidebar {
        width: 220px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        padding: 1.1rem 0.85rem;
        background: #fffcf7;
        border-right: 1px solid #e7e5e4;
      }
      .site-sidebar .site-brand {
        font-weight: 700;
        color: #134e4a;
        text-decoration: none;
        padding: 0.35rem 0.7rem 0.85rem;
      }
      .site-sidebar .site-nav {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }
      .site-sidebar .site-nav a {
        color: #57534e;
        text-decoration: none;
        padding: 0.45rem 0.7rem;
        border-radius: 10px;
        font-size: 0.92rem;
      }
      .site-sidebar .site-nav a:hover,
      .site-sidebar .site-nav a[aria-current="page"] {
        color: #134e4a;
        background: #ccfbf1;
      }
      /* 若共享 nav.js 仍注入 header，保持左栏而不是顶部横排 */
      .app-shell > .site-header {
        position: sticky;
        top: 0;
        width: 220px;
        flex-shrink: 0;
        align-self: stretch;
        border-right: 1px solid var(--line, #e7e5e4);
        border-bottom: 0;
        background: var(--card, #fffcf7);
      }
      .app-shell > .site-header .site-header__inner {
        max-width: none;
        margin: 0;
        padding: 1.1rem 0.85rem;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
      }
      .app-shell > .site-header .site-nav {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }
      .page {
        flex: 1;
        min-width: 0;
        max-width: none;
        margin: 0;
        padding: 2.25rem 1.5rem 3.5rem;
      }
      .kicker {
        margin: 0 0 0.4rem;
        color: #0f766e;
        font-size: 0.85rem;
        letter-spacing: 0.08em;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 2rem;
      }
      .lead {
        margin: 0 0 1.75rem;
        color: #57534e;
        max-width: 42rem;
        line-height: 1.7;
      }
      .stack {
        display: grid;
        gap: 1rem;
      }
      .panel {
        background: #fffcf7;
        border: 1px solid #e7e5e4;
        border-radius: 16px;
        padding: 1.15rem 1.2rem 1.25rem;
        box-shadow: 0 10px 30px rgba(28, 25, 23, 0.08);
      }
      .panel h2 {
        margin: 0 0 0.85rem;
        font-size: 1.1rem;
      }
      form {
        display: grid;
        gap: 0.55rem;
      }
      label {
        font-size: 0.9rem;
        color: #57534e;
      }
      input,
      textarea {
        width: 100%;
        border: 1px solid #e7e5e4;
        border-radius: 10px;
        padding: 0.65rem 0.75rem;
        font: inherit;
        background: #fff;
        color: #1c1917;
      }
      textarea {
        min-height: 8rem;
        resize: vertical;
      }
      button {
        justify-self: start;
        border: 0;
        border-radius: 999px;
        padding: 0.55rem 1.1rem;
        background: #0f766e;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #134e4a;
      }
      .msg {
        min-height: 1.2em;
        margin: 0;
        color: #0f766e;
        font-size: 0.9rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 0.55rem 0.4rem;
        border-bottom: 1px solid #e7e5e4;
        font-size: 0.95rem;
      }
      th {
        color: #57534e;
        font-weight: 600;
      }
      .status {
        white-space: nowrap;
      }
      .board-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin: 0 0 1.25rem;
      }
      .board-nav button {
        background: #fff;
        color: #57534e;
        border: 1px solid #e7e5e4;
      }
      .board-nav button[aria-current="true"] {
        background: #0f766e;
        color: #fff;
        border-color: #0f766e;
      }
      .board[hidden] {
        display: none;
      }
      .fields {
        display: grid;
        gap: 0.55rem;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div id="site-nav">
        <aside class="site-sidebar" aria-label="全站导航">
          <a class="site-brand" href="/">运营部</a>
          <nav class="site-nav">
            <a href="/">首页</a>
            <a href="/data">数据中心</a>
            <a href="/shen">沈子晗运营中心</a>
            <a href="/han" aria-current="page">韩梦凯运营中心</a>
            <a href="/people">人员管理</a>
            <a href="/releases">版本发布中心</a>
            <a href="/me">个人中心</a>
          </nav>
        </aside>
      </div>
      <main class="page">
        <p class="kicker">运营部 · 韩梦凯业务线</p>
        <h1>韩梦凯运营中心</h1>
        <p class="lead">
          韩梦凯团队工作台。任务日报与选品 / 商品 / 付费三个小板块数据互相隔离，也与沈子晗中心隔离；默认负责人为「韩梦凯」。
        </p>
        <nav class="board-nav" aria-label="韩梦凯中心板块">
          <button type="button" data-board="tasks" aria-current="true">任务与日报</button>
          <button type="button" data-board="selection">选品数据</button>
          <button type="button" data-board="products">商品数据</button>
          <button type="button" data-board="paid">付费数据</button>
        </nav>
        <div id="board-tasks" class="board stack">
          <section class="panel">
            <h2>新增任务</h2>
            <form id="task-form">
              <label for="title">标题（必填）</label>
              <input id="title" name="title" required placeholder="任务标题" />
              <button type="submit">添加</button>
              <p class="msg" id="task-msg"></p>
            </form>
          </section>
          <section class="panel">
            <h2>任务列表</h2>
            <table>
              <thead>
                <tr>
                  <th>标题</th>
                  <th>状态</th>
                  <th>负责人</th>
                </tr>
              </thead>
              <tbody id="task-body"></tbody>
            </table>
          </section>
          <section class="panel">
            <h2>今日简报</h2>
            <form id="brief-form">
              <label for="brief">简报</label>
              <textarea id="brief" name="text" placeholder="今日进展…"></textarea>
              <button type="submit">保存简报</button>
              <p class="msg" id="brief-msg"></p>
            </form>
          </section>
        </div>
        <div id="board-selection" class="board stack" hidden>
          <section class="panel">
            <h2>新增选品</h2>
            <form id="selection-form">
              <div class="fields">
                <div>
                  <label for="sel-name">名称（必填）</label>
                  <input id="sel-name" name="name" required placeholder="选品名称" />
                </div>
                <div>
                  <label for="sel-category">类目</label>
                  <input id="sel-category" name="category" placeholder="类目" />
                </div>
              </div>
              <label for="sel-note">备注</label>
              <input id="sel-note" name="note" placeholder="卖点 / 风险" />
              <button type="submit">添加</button>
              <p class="msg" id="selection-msg"></p>
            </form>
          </section>
          <section class="panel">
            <h2>选品列表</h2>
            <table>
              <thead>
                <tr>
                  <th>名称</th>
                  <th>类目</th>
                  <th>状态</th>
                  <th>负责人</th>
                </tr>
              </thead>
              <tbody id="selection-body"></tbody>
            </table>
          </section>
        </div>
        <div id="board-products" class="board stack" hidden>
          <section class="panel">
            <h2>新增商品</h2>
            <form id="product-form">
              <div class="fields">
                <div>
                  <label for="prod-name">名称（必填）</label>
                  <input id="prod-name" name="name" required placeholder="商品名称" />
                </div>
                <div>
                  <label for="prod-sku">SKU</label>
                  <input id="prod-sku" name="sku" placeholder="SKU" />
                </div>
                <div>
                  <label for="prod-price">价格</label>
                  <input id="prod-price" name="price" type="number" step="0.01" placeholder="0.00" />
                </div>
                <div>
                  <label for="prod-stock">库存</label>
                  <input id="prod-stock" name="stock" type="number" step="1" placeholder="0" />
                </div>
              </div>
              <button type="submit">添加</button>
              <p class="msg" id="product-msg"></p>
            </form>
          </section>
          <section class="panel">
            <h2>商品列表</h2>
            <table>
              <thead>
                <tr>
                  <th>名称</th>
                  <th>SKU</th>
                  <th>价格</th>
                  <th>库存</th>
                  <th>负责人</th>
                </tr>
              </thead>
              <tbody id="product-body"></tbody>
            </table>
          </section>
        </div>
        <div id="board-paid" class="board stack" hidden>
          <section class="panel">
            <h2>新增付费记录</h2>
            <form id="paid-form">
              <div class="fields">
                <div>
                  <label for="paid-channel">渠道（必填）</label>
                  <input id="paid-channel" name="channel" required placeholder="信息流 / 搜索" />
                </div>
                <div>
                  <label for="paid-amount">金额</label>
                  <input id="paid-amount" name="amount" type="number" step="0.01" placeholder="0.00" />
                </div>
                <div>
                  <label for="paid-date">日期</label>
                  <input id="paid-date" name="spentOn" type="date" />
                </div>
              </div>
              <label for="paid-note">备注</label>
              <input id="paid-note" name="note" placeholder="投放说明" />
              <button type="submit">添加</button>
              <p class="msg" id="paid-msg"></p>
            </form>
          </section>
          <section class="panel">
            <h2>付费列表</h2>
            <table>
              <thead>
                <tr>
                  <th>渠道</th>
                  <th>金额</th>
                  <th>日期</th>
                  <th>负责人</th>
                </tr>
              </thead>
              <tbody id="paid-body"></tbody>
            </table>
          </section>
        </div>
      </main>
    </div>
    <script src="/shared/nav.js"></script>
    <script>
      const taskBody = document.getElementById("task-body");
      const taskMsg = document.getElementById("task-msg");
      const briefMsg = document.getElementById("brief-msg");
      const briefEl = document.getElementById("brief");

      function escapeHtml(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function renderRows(tbody, rows, cols, emptyCols) {
        tbody.innerHTML = "";
        (rows || []).forEach((row) => {
          const tr = document.createElement("tr");
          tr.innerHTML = cols
            .map(function (key) {
              const extra = key === "status" ? ' class="status"' : "";
              return "<td" + extra + ">" + escapeHtml(row[key]) + "</td>";
            })
            .join("");
          tbody.appendChild(tr);
        });
        if (!rows || !rows.length) {
          const tr = document.createElement("tr");
          tr.innerHTML = '<td colspan="' + emptyCols + '">暂无数据</td>';
          tbody.appendChild(tr);
        }
      }

      function showBoard(name) {
        document.querySelectorAll(".board").forEach(function (el) {
          el.hidden = el.id !== "board-" + name;
        });
        document.querySelectorAll(".board-nav button").forEach(function (btn) {
          btn.setAttribute("aria-current", btn.getAttribute("data-board") === name ? "true" : "false");
        });
      }

      document.querySelector(".board-nav").addEventListener("click", function (e) {
        const btn = e.target.closest("button[data-board]");
        if (!btn) return;
        showBoard(btn.getAttribute("data-board"));
      });

      async function load() {
        const [tasksRes, briefRes, selRes, prodRes, paidRes] = await Promise.all([
          fetch("/api/han/tasks"),
          fetch("/api/han/brief"),
          fetch("/api/han/selection"),
          fetch("/api/han/products"),
          fetch("/api/han/paid"),
        ]);
        const tasksJson = await tasksRes.json();
        const briefJson = await briefRes.json();
        const selJson = await selRes.json();
        const prodJson = await prodRes.json();
        const paidJson = await paidRes.json();
        renderRows(taskBody, tasksJson.tasks, ["title", "status", "owner"], 3);
        briefEl.value = briefJson.text || "";
        renderRows(document.getElementById("selection-body"), selJson.items, ["name", "category", "status", "owner"], 4);
        renderRows(document.getElementById("product-body"), prodJson.items, ["name", "sku", "price", "stock", "owner"], 5);
        renderRows(document.getElementById("paid-body"), paidJson.items, ["channel", "amount", "spentOn", "owner"], 4);
      }

      document.getElementById("task-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const title = document.getElementById("title").value;
        const res = await fetch("/api/han/tasks", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title }),
        });
        const json = await res.json();
        taskMsg.textContent = json.ok ? "已添加" : json.error || "失败";
        if (json.ok) {
          document.getElementById("title").value = "";
          await load();
        }
      });

      document.getElementById("brief-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const res = await fetch("/api/han/brief", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: briefEl.value }),
        });
        const json = await res.json();
        briefMsg.textContent = json.ok ? "已保存" : "保存失败";
      });

      document.getElementById("selection-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const res = await fetch("/api/han/selection", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("sel-name").value,
            category: document.getElementById("sel-category").value,
            note: document.getElementById("sel-note").value,
          }),
        });
        const json = await res.json();
        document.getElementById("selection-msg").textContent = json.ok ? "已添加" : json.error || "失败";
        if (json.ok) {
          document.getElementById("selection-form").reset();
          await load();
        }
      });

      document.getElementById("product-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const res = await fetch("/api/han/products", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("prod-name").value,
            sku: document.getElementById("prod-sku").value,
            price: document.getElementById("prod-price").value,
            stock: document.getElementById("prod-stock").value,
          }),
        });
        const json = await res.json();
        document.getElementById("product-msg").textContent = json.ok ? "已添加" : json.error || "失败";
        if (json.ok) {
          document.getElementById("product-form").reset();
          await load();
        }
      });

      document.getElementById("paid-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const res = await fetch("/api/han/paid", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            channel: document.getElementById("paid-channel").value,
            amount: document.getElementById("paid-amount").value,
            spentOn: document.getElementById("paid-date").value,
            note: document.getElementById("paid-note").value,
          }),
        });
        const json = await res.json();
        document.getElementById("paid-msg").textContent = json.ok ? "已添加" : json.error || "失败";
        if (json.ok) {
          document.getElementById("paid-form").reset();
          await load();
        }
      });

      load().catch((err) => {
        taskMsg.textContent = String(err);
      });
    </script>
  </body>
</html>
