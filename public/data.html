<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据中心 · 运营部</title>
    <link rel="stylesheet" href="/shared/layout.css" />
    <style>
      /* 本页完整顶栏与看板样式：shared 文件尚未交付时仍可独立使用 */
      :root {
        --bg: #f3f1ec;
        --ink: #1c1917;
        --muted: #57534e;
        --line: #e7e5e4;
        --card: #fffcf7;
        --accent: #0f766e;
        --accent-ink: #134e4a;
        --shadow: 0 10px 30px rgba(28, 25, 23, 0.08);
        font-family: "PingFang SC", "Noto Sans SC", "Source Han Sans SC", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
      }
      .site-header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(255, 252, 247, 0.94);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .site-header__inner {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0.85rem 1.25rem;
        display: flex;
        align-items: center;
        gap: 1.25rem;
      }
      .site-brand {
        font-weight: 700;
        color: var(--accent-ink);
        text-decoration: none;
        white-space: nowrap;
      }
      .site-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem 0.15rem;
      }
      .site-nav a {
        color: var(--muted);
        text-decoration: none;
        padding: 0.4rem 0.7rem;
        border-radius: 999px;
        font-size: 0.92rem;
      }
      .site-nav a:hover,
      .site-nav a[aria-current="page"] {
        color: var(--accent-ink);
        background: #ccfbf1;
      }
      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2.25rem 1.25rem 3.5rem;
      }
      .kicker {
        margin: 0 0 0.4rem;
        color: var(--accent);
        font-size: 0.85rem;
        letter-spacing: 0.08em;
      }
      h1 { margin: 0 0 0.75rem; font-size: 2rem; }
      .lead {
        margin: 0 0 1.75rem;
        color: var(--muted);
        max-width: 42rem;
        line-height: 1.7;
      }
      .metric-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .metric-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 1.15rem 1.2rem 1.25rem;
        box-shadow: var(--shadow);
      }
      .metric-card .label { color: var(--muted); font-size: 0.92rem; }
      .metric-card .value {
        margin: 0.45rem 0 0.35rem;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .badge {
        display: inline-block;
        font-size: 0.75rem;
        color: var(--accent-ink);
        background: #ccfbf1;
        border-radius: 999px;
        padding: 0.15rem 0.55rem;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .panel h2 {
        margin: 0;
        padding: 1rem 1.2rem;
        font-size: 1.05rem;
        border-bottom: 1px solid var(--line);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        text-align: left;
        padding: 0.75rem 1.2rem;
        border-bottom: 1px solid var(--line);
        font-size: 0.95rem;
      }
      th { color: var(--muted); font-weight: 600; }
      tr:last-child td { border-bottom: none; }
      .error { color: #b91c1c; padding: 1rem 1.2rem; }
    </style>
  </head>
  <body>
    <div id="site-nav">
      <header class="site-header">
        <div class="site-header__inner">
          <a class="site-brand" href="/">运营部</a>
          <nav class="site-nav" aria-label="全站导航">
            <a href="/">首页</a>
            <a href="/data" aria-current="page">数据中心</a>
            <a href="/shen">沈子晗运营中心</a>
            <a href="/han">韩梦凯运营中心</a>
            <a href="/people">人员管理</a>
            <a href="/releases">版本发布中心</a>
            <a href="/me">个人中心</a>
          </nav>
        </div>
      </header>
    </div>
    <main class="page">
      <p class="kicker">运营部</p>
      <h1>数据中心</h1>
      <p class="lead">运营关键指标看板。数字为占位演示，不连接业务库。</p>
      <section class="metric-grid" id="cards" aria-label="关键指标">
        <article class="metric-card">
          <div class="label">今日订单</div>
          <div class="value">128</div>
          <span class="badge">演示数据</span>
        </article>
        <article class="metric-card">
          <div class="label">待处理</div>
          <div class="value">17</div>
          <span class="badge">演示数据</span>
        </article>
        <article class="metric-card">
          <div class="label">在职人数</div>
          <div class="value">36</div>
          <span class="badge">演示数据</span>
        </article>
        <article class="metric-card">
          <div class="label">本周发布次数</div>
          <div class="value">5</div>
          <span class="badge">演示数据</span>
        </article>
      </section>
      <section class="panel">
        <h2>最近数据事件</h2>
        <table>
          <thead>
            <tr>
              <th>时间</th>
              <th>类型</th>
              <th>摘要</th>
            </tr>
          </thead>
          <tbody id="events">
            <tr><td colspan="3">正在加载…</td></tr>
          </tbody>
        </table>
      </section>
    </main>
    <script src="/shared/nav.js"></script>
    <script>
      (function () {
        const cardsEl = document.getElementById("cards");
        const eventsEl = document.getElementById("events");

        function escapeHtml(value) {
          return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
        }

        function renderCards(cards, notice) {
          cardsEl.innerHTML = cards
            .map(function (card) {
              return (
                '<article class="metric-card">' +
                '<div class="label">' +
                escapeHtml(card.label) +
                "</div>" +
                '<div class="value">' +
                escapeHtml(card.value) +
                "</div>" +
                '<span class="badge">' +
                escapeHtml(notice || "演示数据") +
                "</span>" +
                "</article>"
              );
            })
            .join("");
        }

        function renderEvents(events) {
          if (!events || !events.length) {
            eventsEl.innerHTML = '<tr><td colspan="3">暂无事件</td></tr>';
            return;
          }
          eventsEl.innerHTML = events
            .map(function (row) {
              return (
                "<tr><td>" +
                escapeHtml(row.time) +
                "</td><td>" +
                escapeHtml(row.type) +
                "</td><td>" +
                escapeHtml(row.summary) +
                "</td></tr>"
              );
            })
            .join("");
        }

        fetch("/api/data/overview")
          .then(function (res) {
            if (!res.ok) throw new Error("接口 " + res.status);
            return res.json();
          })
          .then(function (data) {
            renderCards(data.cards || [], data.notice);
            renderEvents(data.events || []);
          })
          .catch(function (err) {
            eventsEl.innerHTML =
              '<tr><td colspan="3" class="error">无法加载数据事件：' +
              escapeHtml(err.message) +
              "</td></tr>";
          });
      })();
    </script>
  </body>
</html>
