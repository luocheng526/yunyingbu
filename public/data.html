<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据中心 · 星脉管理系统</title>
    <link rel="stylesheet" href="/shared/layout.css" />
    <style>
      /* 仅看板内容；左栏与顶栏由 /shared/nav.js 注入 */
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        text-align: left;
        padding: 0.75rem 0.2rem;
        border-bottom: 1px solid #f5f5f5;
        font-size: 0.95rem;
      }
      th { color: var(--xm-muted, #8c8c8c); font-weight: 600; }
      tr:last-child td { border-bottom: none; }
      .error { color: #b91c1c; }
    </style>
  </head>
  <body>
    <div id="site-nav"></div>
    <main class="xm-page">
      <p class="kicker">运营部</p>
      <h1>数据中心</h1>
      <p class="lead">运营关键指标看板。数字为占位演示，不连接业务库。</p>
      <section class="kpi-grid" id="cards" aria-label="关键指标">
        <article class="kpi-card">
          <div class="label">今日订单</div>
          <div class="value">128</div>
          <span class="demo-flag">演示数据</span>
        </article>
        <article class="kpi-card">
          <div class="label">待处理</div>
          <div class="value">17</div>
          <span class="demo-flag">演示数据</span>
        </article>
        <article class="kpi-card">
          <div class="label">在职人数</div>
          <div class="value">36</div>
          <span class="demo-flag">演示数据</span>
        </article>
        <article class="kpi-card">
          <div class="label">本周发布次数</div>
          <div class="value">5</div>
          <span class="demo-flag">演示数据</span>
        </article>
      </section>
      <section class="panel">
        <h2>最近数据事件</h2>
        <table>
          <thead>
            <tr>
              <th>时间</th>
              <th>类型</th>
              <th>摘要</th>
            </tr>
          </thead>
          <tbody id="events">
            <tr><td colspan="3">正在加载…</td></tr>
          </tbody>
        </table>
      </section>
    </main>
    <script src="/shared/nav.js"></script>
    <script>
      (function () {
        const cardsEl = document.getElementById("cards");
        const eventsEl = document.getElementById("events");

        function escapeHtml(value) {
          return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
        }

        function renderCards(cards, notice) {
          cardsEl.innerHTML = cards
            .map(function (card) {
              return (
                '<article class="kpi-card">' +
                '<div class="label">' +
                escapeHtml(card.label) +
                "</div>" +
                '<div class="value">' +
                escapeHtml(card.value) +
                "</div>" +
                '<span class="demo-flag">' +
                escapeHtml(notice || "演示数据") +
                "</span>" +
                "</article>"
              );
            })
            .join("");
        }

        function renderEvents(events) {
          if (!events || !events.length) {
            eventsEl.innerHTML = '<tr><td colspan="3">暂无事件</td></tr>';
            return;
          }
          eventsEl.innerHTML = events
            .map(function (row) {
              return (
                "<tr><td>" +
                escapeHtml(row.time) +
                "</td><td>" +
                escapeHtml(row.type) +
                "</td><td>" +
                escapeHtml(row.summary) +
                "</td></tr>"
              );
            })
            .join("");
        }

        fetch("/api/data/overview", {
          credentials: "same-origin",
          headers: { Accept: "application/json" }
        })
          .then(function (res) {
            if (!res.ok) throw new Error("接口 " + res.status);
            return res.json();
          })
          .then(function (data) {
            renderCards(data.cards || [], data.notice);
            renderEvents(data.events || []);
          })
          .catch(function (err) {
            eventsEl.innerHTML =
              '<tr><td colspan="3" class="error">无法加载数据事件：' +
              escapeHtml(err.message) +
              "</td></tr>";
          });
      })();
    </script>
  </body>
</html>
