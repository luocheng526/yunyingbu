<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据中心 · 星脉管理系统</title>
    <link rel="stylesheet" href="/shared/layout.css" />
    <link rel="stylesheet" href="/data-pages.css" />
  </head>
  <body>
    <div id="site-nav"></div>
    <main class="xm-page xm-ui-scope" id="data-home">
      <h1>数据中心</h1>
      <nav class="data-subnav" id="data-subnav"></nav>
      <p class="lead">运营关键指标看板。数字为占位演示，不连接业务库。</p>
      <div id="cards" aria-label="关键指标"></div>
      <div id="events-wrap"></div>
    </main>
    <script src="/data-xm-ui.js"></script>
    <script src="/data-overview.js?v=xm-module"></script>
    <script src="/shared/nav.js"></script>
    <script src="/data-subnav.js"></script>
    <script>
      (function () {
        const DEMO_CARDS = [
          { label: "今日订单", value: "128" },
          { label: "待处理", value: "17" },
          { label: "在职人数", value: "36" },
          { label: "本周发布次数", value: "5" }
        ];
        const cardsEl = document.getElementById("cards");
        const eventsWrap = document.getElementById("events-wrap");
        const home = document.getElementById("data-home");

        function paint(cards, events, notice) {
          const kit = window.XmUI;
          const ui = window.XmDataUi;
          if (!kit || !ui) {
            return;
          }
          if (home) {
            ui.markScope(home);
          }
          cardsEl.innerHTML = ui.statGrid(
            (cards || []).map(function (card) {
              return { label: card.label, value: card.value, note: notice || "演示数据" };
            })
          );
          const rows = (events || []).map(function (row) {
            return { time: row.time, type: row.type, summary: row.summary };
          });
          eventsWrap.innerHTML = kit.ContentCard({
            title: "最近数据事件",
            content:
              rows.length
                ? kit.DataTable({
                    columns: [
                      { key: "time", label: "时间" },
                      { key: "type", label: "类型" },
                      { key: "summary", label: "摘要" }
                    ],
                    rows: rows
                  })
                : kit.EmptyState({ title: "暂无事件" })
          });
        }

        window.XmDataUi.ready(function () {
          paint(DEMO_CARDS, [], "演示数据");
          fetch("/api/data/overview", {
            credentials: "same-origin",
            headers: { Accept: "application/json" }
          })
            .then(function (res) {
              if (!res.ok) throw new Error("接口 " + res.status);
              return res.json();
            })
            .then(function (data) {
              paint(data.cards || DEMO_CARDS, data.events || [], data.notice || "演示数据");
            })
            .catch(function (err) {
              paint(DEMO_CARDS, [{ time: "—", type: "error", summary: "无法加载数据事件：" + err.message }], "演示数据");
            });
        });
      })();
    </script>
  </body>
</html>
