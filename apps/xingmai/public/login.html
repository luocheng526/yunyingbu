<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 星脉管理系统</title>
  <link rel="stylesheet" href="/login.css?v=0.1.53" />
  <script>try{var t=localStorage.getItem("xm-theme");if(t==="dark"||t==="light"){document.documentElement.setAttribute("data-theme",t);document.documentElement.style.colorScheme=t;}}catch(e){}</script>
</head>
<body class="login-page">
  <button type="button" class="login-theme" data-login-theme aria-label="切换主题">◐</button>
  <main class="login-wrap">
    <section class="login-card">
      <header class="login-brand">
        <span class="login-mark" aria-hidden="true">星</span>
        <p class="login-kicker">星脉管理系统</p>
        <h1>登录</h1>
      </header>
      <form id="login-form" class="login-form" novalidate>
        <label class="field">
          <span>账号</span>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="输入账号" required />
        </label>
        <label class="field">
          <span>密码</span>
          <div class="field-row">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入密码" required />
            <button type="button" class="ghost-btn" data-toggle-password>显示</button>
          </div>
        </label>
        <label class="remember">
          <input id="remember" name="remember" type="checkbox" />
          <span>记住账号</span>
        </label>
        <button type="submit" class="primary-btn" data-submit>进入</button>
        <p class="error" data-error hidden></p>
      </form>
      <p class="hint">正式账号由管理员开通。演示：luocheng / ChangeMe123!</p>
    </section>
  </main>
  <script>
    (function () {
      var KEY = "xingmai.rememberUsername";
      var THEME_KEY = "xm-theme";
      var form = document.getElementById("login-form");
      var username = document.getElementById("username");
      var password = document.getElementById("password");
      var remember = document.getElementById("remember");
      var error = document.querySelector("[data-error]");
      var submit = document.querySelector("[data-submit]");
      var toggle = document.querySelector("[data-toggle-password]");
      var themeBtn = document.querySelector("[data-login-theme]");

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
      }
      applyTheme(localStorage.getItem("xm-theme") || "light");
      themeBtn.addEventListener("click", function () {
        var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        localStorage.setItem(THEME_KEY, next);
        applyTheme(next);
      });

      var saved = localStorage.getItem(KEY);
      if (saved) {
        username.value = saved;
        remember.checked = true;
      }

      toggle.addEventListener("click", function () {
        var show = password.type === "password";
        password.type = show ? "text" : "password";
        toggle.textContent = show ? "隐藏" : "显示";
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        error.hidden = true;
        submit.disabled = true;
        try {
          var res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: username.value.trim(),
              password: password.value,
              remember: remember.checked
            })
          });
          var data = await res.json();
          if (!res.ok) throw new Error(data.error || "登录失败");
          if (remember.checked) localStorage.setItem(KEY, username.value.trim());
          else localStorage.removeItem(KEY);
          window.location.href = "/";
        } catch (err) {
          error.textContent = err.message || "连不上服务器。请确认地址是 https://zx.xingmaierp.cc/login。";
          error.hidden = false;
        } finally {
          submit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
