<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 星脉管理系统</title>
  <link rel="stylesheet" href="/login.css?v=0.1.65" />
  <script>try{var t=localStorage.getItem("xm-theme");if(t==="dark"||t==="light"){document.documentElement.setAttribute("data-theme",t);document.documentElement.style.colorScheme=t;}}catch(e){}</script>
</head>
<body class="login-page">
  <main class="login-split">
    <section class="login-hero" aria-label="星脉甄选运营中心">
      <img class="hero-shot" src="/login-hero.jpg" width="1236" height="841" alt="星脉甄选运营中心：用数据驱动运营，让每一份努力都有回报" />
    </section>

    <section class="login-pane">
      <div class="pane-box">
        <header class="pane-head">
          <h1>登录</h1>
          <p>欢迎使用星脉甄选运营中心</p>
        </header>
        <form id="login-form" class="login-form" novalidate>
          <label class="field">
            <span class="sr-only">账号名称</span>
            <div class="field-box">
              <i class="ico ico-user" aria-hidden="true"></i>
              <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入账号" required />
            </div>
          </label>
          <label class="field">
            <span class="sr-only">登录密码</span>
            <div class="field-box">
              <i class="ico ico-lock" aria-hidden="true"></i>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required />
              <button type="button" class="ghost-btn" data-toggle-password aria-label="显示密码"></button>
            </div>
          </label>
          <div class="form-row">
            <label class="remember">
              <input id="remember" name="remember" type="checkbox" />
              <span>记住我</span>
            </label>
            <button type="button" class="link-btn" data-forgot>忘记密码?</button>
          </div>
          <button type="submit" class="primary-btn" data-submit>登录</button>
          <p class="error" data-error hidden></p>
        </form>
        <p class="hint">正式账号由管理员开通。演示：luocheng / ChangeMe123!</p>
      </div>
      <p class="pane-foot">数据 · 运营 · 组织 · 人才 · 增长<br /><span>DATA · OPERATION · ORGANIZATION · TALENT · GROWTH</span></p>
      <button type="button" class="login-theme" data-login-theme aria-label="切换主题"></button>
    </section>
  </main>
  <script>
    (function () {
      var KEY = "xingmai.rememberUsername";
      var THEME_KEY = "xm-theme";
      var form = document.getElementById("login-form");
      var username = document.getElementById("username");
      var password = document.getElementById("password");
      var remember = document.getElementById("remember");
      var error = document.querySelector("[data-error]");
      var submit = document.querySelector("[data-submit]");
      var toggle = document.querySelector("[data-toggle-password]");
      var themeBtn = document.querySelector("[data-login-theme]");
      var forgot = document.querySelector("[data-forgot]");

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
      }
      applyTheme(localStorage.getItem("xm-theme") || "light");
      themeBtn.addEventListener("click", function () {
        var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        localStorage.setItem(THEME_KEY, next);
        applyTheme(next);
      });

      var saved = localStorage.getItem(KEY);
      if (saved) {
        username.value = saved;
        remember.checked = true;
      }

      toggle.addEventListener("click", function () {
        var show = password.type === "password";
        password.type = show ? "text" : "password";
        toggle.classList.toggle("is-on", show);
        toggle.setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
      });

      forgot.addEventListener("click", function () {
        error.textContent = "请联系管理员开通或重置密码。";
        error.hidden = false;
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        error.hidden = true;
        submit.disabled = true;
        try {
          var res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: username.value.trim(),
              password: password.value,
              remember: remember.checked
            })
          });
          var data = await res.json();
          if (!res.ok) throw new Error(data.error || "登录失败");
          if (remember.checked) localStorage.setItem(KEY, username.value.trim());
          else localStorage.removeItem(KEY);
          window.location.href = "/";
        } catch (err) {
          error.textContent = err.message || "连不上服务器。请确认地址是 https://zx.xingmaierp.cc/login。";
          error.hidden = false;
        } finally {
          submit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
