<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>版本发布中心 · 运营部</title>
    <link rel="stylesheet" href="/shared/layout.css" />
    <style>
      main.page {
        flex: 1;
        min-width: 0;
      }
      .banner {
        background: #fff1f2;
        border: 1px solid #fecdd3;
        color: #9f1239;
        border-radius: 14px;
        padding: 1rem 1.15rem;
        line-height: 1.65;
        font-weight: 600;
        margin: 0 0 1.5rem;
      }
      .grid { display: grid; gap: 1.25rem; }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 1.15rem 1.2rem 1.3rem;
        box-shadow: var(--shadow);
      }
      .panel h2 { margin: 0 0 0.45rem; font-size: 1.15rem; }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
      }
      button {
        font: inherit;
        border: 0;
        border-radius: 999px;
        padding: 0.45rem 0.95rem;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
      }
      button.secondary { background: #44403c; }
      button.danger { background: #be123c; }
      button:disabled { cursor: not-allowed; opacity: 0.55; }
      table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
      th, td {
        text-align: left;
        padding: 0.55rem 0.4rem;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      .muted { color: var(--muted); font-size: 0.88rem; }
      .badge {
        display: inline-block;
        padding: 0.1rem 0.5rem;
        border-radius: 999px;
        background: #ccfbf1;
        color: var(--accent-ink);
        font-size: 0.75rem;
        margin-left: 0.35rem;
      }
      .lock-box {
        background: #0f766e;
        color: #fff;
        border-radius: 14px;
        padding: 1rem 1.15rem;
      }
      .lock-box.empty { background: #57534e; }
      .flash {
        margin: 0 0 1rem;
        padding: 0.7rem 0.9rem;
        border-radius: 10px;
        background: #fef3c7;
        color: #92400e;
        display: none;
      }
      .flash.show { display: block; }
      .flash.err { background: #ffe4e6; color: #9f1239; }
      .ticket {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 1rem 1.05rem;
        margin: 0 0 0.85rem;
        background: #fff;
      }
      .ticket__head {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 1rem;
        align-items: baseline;
        margin-bottom: 0.55rem;
      }
      .ticket__rank {
        font-weight: 700;
        color: var(--accent-ink);
      }
      .ticket dl {
        margin: 0;
        display: grid;
        gap: 0.35rem 1rem;
        grid-template-columns: 6.5rem 1fr;
        font-size: 0.92rem;
      }
      .ticket dt { color: var(--muted); }
      .ticket dd { margin: 0; }
      .ticket ul { margin: 0; padding-left: 1.1rem; }
    </style>
  </head>
  <body>
    <div id="site-nav"></div>
    <main class="page" role="main">
      <p class="kicker">运营部主脑闸门</p>
      <h1>版本发布中心</h1>
      <p class="lead">各模块对话提交发版后，在这里排队。看清更新了什么，调整优先级，点「确定」才放行。本页不再用手填申请表。</p>
      <div class="banner">
        单据来自各 Agent 对话（POST 发布文档）。点确定才会真正发版。同一时刻一把锁，下一条不会自动放行。可用上移 / 下移改排队顺序。
      </div>
      <div id="flash" class="flash" role="status"></div>
      <div class="grid">
        <section class="panel" id="lock-panel">
          <h2>发布中（全局锁）</h2>
          <div id="lock-view" class="lock-box empty">当前空闲，没有发布任务。</div>
        </section>
        <section class="panel">
          <h2>待放行队列</h2>
          <p class="muted">按优先级排列。数字越小越先发。来自各对话框的提交会显示在这里。</p>
          <div id="queue-view"></div>
        </section>
        <section class="panel">
          <h2>历史</h2>
          <div id="history-view"></div>
        </section>
      </div>
    </main>
    <script src="/shared/nav.js"></script>
    <script>
      const flashEl = document.getElementById("flash");
      function flash(message, isError) {
        flashEl.textContent = message;
        flashEl.className = "flash show" + (isError ? " err" : "");
      }
      function goLogin() { window.location.replace("/login"); }
      function esc(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      async function api(path, options) {
        const res = await fetch(path, {
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          ...options
        });
        if (res.status === 401) {
          goLogin();
          const err = new Error("未登录");
          err.status = 401;
          throw err;
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const err = new Error(data.error || "请求失败");
          err.status = res.status;
          err.body = data;
          throw err;
        }
        return data;
      }
      function fmt(ts) {
        return ts ? String(ts).replace("T", " ").replace("Z", " UTC") : "—";
      }
      function demoBadge(item) {
        return item.demo ? '<span class="badge">演示</span>' : "";
      }
      function renderLock(lock) {
        const el = document.getElementById("lock-view");
        if (!lock.locked) {
          el.className = "lock-box empty";
          el.textContent = "当前空闲，没有发布任务。";
          return;
        }
        el.className = "lock-box";
        const cur = lock.current || {};
        el.innerHTML =
          "<div>正在放行，禁止抢发。</div>" +
          "<div>版本号：" + esc(cur.version || "—") + "</div>" +
          "<div>开始时间：" + esc(fmt(cur.startedAt)) + "</div>";
      }
      function renderQueue(items, locked) {
        const el = document.getElementById("queue-view");
        if (!items.length) {
          el.innerHTML = '<p class="muted">还没有对话提交发版。各模块做完后把【发布文档】交给版本发布中心，就会出现在这里。</p>';
          return;
        }
        el.innerHTML = items.map(function (item, index) {
          const files = (item.files || []).map(function (file) {
            return "<li>" + esc(file) + "</li>";
          }).join("") || "<li class=\"muted\">未列文件（可能整包同步）</li>";
          const confirmBtn = locked
            ? "<button disabled>有发布正在进行</button>"
            : "<button data-act=\"confirm\">确定放行</button>";
          return (
            '<article class="ticket" data-id="' + esc(item.id) + '">' +
            '<div class="ticket__head">' +
            '<span class="ticket__rank">排队 #' + (index + 1) + '</span>' +
            "<strong>" + esc(item.module) + "</strong>" +
            "<span class=\"muted\">" + esc(item.version) + "</span>" +
            demoBadge(item) +
            "</div>" +
            "<dl>" +
            "<dt>来自对话</dt><dd>" + esc(item.source || item.applicant) + "</dd>" +
            "<dt>更新了什么</dt><dd>" + esc(item.summary) + "</dd>" +
            "<dt>文件</dt><dd><ul>" + files + "</ul></dd>" +
            "<dt>怎么验收</dt><dd>" + esc(item.acceptance || "—") + "</dd>" +
            "<dt>是否重启</dt><dd>" + (item.restart ? "是" : "否") + "</dd>" +
            "<dt>提交时间</dt><dd>" + esc(fmt(item.submittedAt)) + "</dd>" +
            "</dl>" +
            '<div class="row" style="margin-top:0.8rem">' +
            '<button class="secondary" data-act="up"' + (index === 0 ? " disabled" : "") + ">上移优先</button>" +
            '<button class="secondary" data-act="down"' + (index === items.length - 1 ? " disabled" : "") + ">下移</button>" +
            confirmBtn +
            '<button class="danger" data-act="reject">驳回</button>' +
            "</div></article>"
          );
        }).join("");
      }
      function renderHistory(items) {
        const el = document.getElementById("history-view");
        if (!items.length) {
          el.innerHTML = '<p class="muted">暂无历史。</p>';
          return;
        }
        el.innerHTML =
          "<table><thead><tr><th>状态</th><th>来自 / 模块</th><th>更新摘要</th><th>日志</th></tr></thead><tbody>" +
          items.map(function (item) {
            return (
              "<tr>" +
              "<td>" + esc(item.status) + "</td>" +
              "<td>" + esc(item.source || item.applicant) + "<br><span class=\"muted\">" + esc(item.module) + " · " + esc(item.version) + "</span></td>" +
              "<td>" + esc(item.summary) +
              (item.rejectReason ? "<br><span class=\"muted\">驳回：" + esc(item.rejectReason) + "</span>" : "") +
              "</td>" +
              "<td>" + esc(item.log || "—") + "</td></tr>"
            );
          }).join("") +
          "</tbody></table>";
      }
      async function refresh() {
        const [all, queue, lock] = await Promise.all([
          api("/api/releases"),
          api("/api/releases/queue"),
          api("/api/releases/lock")
        ]);
        renderLock(lock);
        renderQueue(queue.items || [], lock.locked);
        renderHistory(
          (all.items || []).filter(function (item) {
            return item.status === "success" || item.status === "failed" || item.status === "rejected" || item.status === "approved" || item.status === "publishing";
          })
        );
        return lock;
      }
      document.body.addEventListener("click", async function (event) {
        const btn = event.target.closest("button[data-act]");
        if (!btn) return;
        const card = btn.closest("[data-id]");
        const id = card && card.getAttribute("data-id");
        if (!id) return;
        const act = btn.getAttribute("data-act");
        btn.disabled = true;
        try {
          if (act === "up" || act === "down") {
            await api("/api/releases/" + id + "/move", {
              method: "POST",
              body: JSON.stringify({ direction: act })
            });
            flash(act === "up" ? "已提高优先级。" : "已降低优先级。");
          } else if (act === "confirm") {
            flash("正在确定放行，请勿重复点击。");
            const done = await api("/api/releases/" + id + "/confirm", { method: "POST", body: "{}" });
            flash("已放行：版本 " + (done.version || "") + "。下一条不会自动发布。");
          } else if (act === "reject") {
            const reason = window.prompt("请填写驳回原因（必填）");
            if (!reason || !reason.trim()) {
              flash("驳回已取消：必须填写原因。", true);
              btn.disabled = false;
              return;
            }
            await api("/api/releases/" + id + "/reject", {
              method: "POST",
              body: JSON.stringify({ reason: reason.trim() })
            });
            flash("已驳回，该单不可发布。");
          }
          await refresh();
        } catch (err) {
          flash((err.status || "") + " " + err.message, true);
          await refresh();
        }
      });
      refresh().catch(function (err) { flash(err.message, true); });
      setInterval(function () { refresh().catch(function () {}); }, 2000);
    </script>
  </body>
</html>
