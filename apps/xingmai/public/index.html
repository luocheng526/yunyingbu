        </div>

          <a class="xm-menu-item" href="/data"><i class="xm-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V10"/><path d="M10 19V6"/><path d="M15 19v-7"/><path d="M20 19V8"/></svg></i><span>数据中心</span></a>
          <a class="xm-menu-item" href="/shen"><i class="xm-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="16" rx="2"/><path d="M9 9h6"/><path d="M9 13h6"/><path d="M9 17h4"/></svg></i><span>沈子晗运营中心</span></a>
          <a class="xm-menu-item" href="/han"><i class="xm-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11.5 12 5l4 6.5"/><path d="M6.5 13h11l-1.2 6H7.7z"/></svg></i><span>韩梦凯运营中心</span></a>
          <a class="xm-menu-item" href="/people"><i class="xm-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="2.2"/><path d="M4.8 18c.4-2.4 2.2-3.8 4.2-3.8s3.8 1.4 4.2 3.8"/><circle cx="16.2" cy="8.4" r="1.8"/><path d="M15 14.4c1.7.2 3 1.3 3.4 3.1"/></svg></i><span>人员管理</span></a>
        </nav>
        <nav class="xm-menu xm-menu-foot">
          <a class="xm-menu-item" href="/releases"><i class="xm-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="M8.5 7.5 12 4l3.5 3.5"/><rect x="6" y="14" width="12" height="6" rx="1"/></svg></i><span>版本发布中心</span></a>
          <a class="xm-menu-item" href="/me"><i class="xm-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="2.6"/><path d="M6.2 18.5c.6-2.8 2.8-4.3 5.8-4.3s5.2 1.5 5.8 4.3"/></svg></i><span>个人中心</span></a>
          <button type="button" class="xm-menu-item xm-logout" id="xm-logout"><i class="xm-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 7V5.8A1.8 1.8 0 0 1 11.8 4h6.4A1.8 1.8 0 0 1 20 5.8v12.4a1.8 1.8 0 0 1-1.8 1.8h-6.4A1.8 1.8 0 0 1 10 18.2V17"/><path d="M4 12h10"/><path d="M11.2 8.8 14.4 12l-3.2 3.2"/></svg></i><span>退出登录</span></button>
          <p class="xm-version">v0.4.5</p>
        </nav>
      </aside>
      <div class="xm-main">
        <header class="xm-topbar">
          <div class="xm-tabs" aria-label="页签"><span class="xm-tab is-active">首页</span></div>
          <div class="xm-user">
            <span class="xm-username" id="xm-username">用户</span>
          </div>
        </header>
        <div class="xm-content">
    <main class="xm-page" id="home-dashboard">
      <section class="kpi-grid" id="kpi-grid" aria-label="指标卡"></section>
      <div class="dash-bottom">
        <section class="panel" aria-labelledby="trend-title">
          <h2 id="trend-title">趋势看板<span class="demo-flag">演示</span></h2>
          <svg class="trend-svg" id="trend-svg" viewBox="0 0 640 220" role="img" aria-label="近七日销售趋势"></svg>
        </section>
        <div>
          <section class="panel sales-index" aria-labelledby="index-title">
            <h2 id="index-title">实时销售指数<span class="demo-flag">演示</span></h2>
            <div class="figure" id="sales-index">128.6</div>
            <p class="hint">相对昨日 +3.4%，第一期演示数据</p>
          </section>
          <section class="panel" style="margin-top: 12px" aria-labelledby="board-title">
            <h2 id="board-title">龙虎榜<span class="demo-flag">演示</span></h2>
            <ol class="board-list" id="board-list"></ol>
          </section>
        </div>
      </div>
    </main>
        </div>
      </div>
    </div>
    <script src="/shared/nav.js"></script>
    <script>
      (function () {
        const DEMO = {
          kpis: [
            { label: "今日销售额", value: "128,600", unit: "元" },
            { label: "今日订单", value: 128, unit: "单" },
            { label: "待处理", value: 17, unit: "件" },
            { label: "客单价", value: "1,005", unit: "元" }
          ],
          trend: [86, 92, 101, 97, 110, 118, 128],
          board: [
            { name: "华东一仓", value: "32,400" },
            { name: "华南旗舰", value: "28,150" },
            { name: "沈子晗组", value: "21,080" },
            { name: "韩梦凯组", value: "19,760" },
            { name: "华北直营", value: "16,230" }
          ]
        };

        function renderKpis(cards) {
          const root = document.getElementById("kpi-grid");
          if (!root) return;
          root.innerHTML = cards
            .slice(0, 4)
            .map(function (card) {
              return (
                '<article class="kpi-card"><div class="label">' +
                card.label +
                '</div><div class="value">' +
                card.value +
                '<span class="unit">' +
                (card.unit || "") +
                "</span></div></article>"
              );
            })
            .join("");
        }

        function renderTrend(points) {
          const svg = document.getElementById("trend-svg");
          if (!svg) return;
          const max = Math.max.apply(null, points.concat([1]));
          const w = 640;
          const h = 220;
          const step = (w - 40) / Math.max(points.length - 1, 1);
          const coords = points.map(function (p, i) {
            const x = 20 + i * step;
            const y = h - 24 - (p / max) * (h - 48);
            return x + "," + y;
          });
          svg.innerHTML =
            '<polyline fill="none" stroke="#1677ff" stroke-width="3" points="' +
            coords.join(" ") +
            '"></polyline>' +
            coords
              .map(function (c) {
                const xy = c.split(",");
                return '<circle cx="' + xy[0] + '" cy="' + xy[1] + '" r="4" fill="#1677ff"></circle>';
              })
              .join("");
        }

        function renderBoard(rows) {
          const list = document.getElementById("board-list");
          if (!list) return;
          list.innerHTML = rows
            .map(function (row, i) {
              return (
                "<li><span class=\"rank\">" +
                (i + 1) +
                '</span><span class="name">' +
                row.name +
                '</span><span>' +
                row.value +
                "</span></li>"
              );
            })
            .join("");
        }

        function paint(payload) {
          renderKpis(payload.kpis);
          renderTrend(payload.trend || DEMO.trend);
          renderBoard(payload.board || DEMO.board);
        }

        paint(DEMO);

        fetch("/api/data/overview", { credentials: "same-origin", headers: { Accept: "application/json" } })
          .then(function (res) {
            return res.ok ? res.json() : null;
          })
          .then(function (json) {
            if (!json || !Array.isArray(json.cards) || !json.cards.length) {
              return;
            }
            paint({
              kpis: json.cards,
              trend: DEMO.trend,
              board: DEMO.board
            });
          })
          .catch(function () {
            /* keep demo numbers */
          });
      })();
    </script>
  </body>
</html>
