server {
    listen 80;
    listen [::]:80;
    server_name zx.xingmaierp.cc;

    access_log /var/log/nginx/zx.xingmaierp.cc.access.log;
    error_log  /var/log/nginx/zx.xingmaierp.cc.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    listen 18080 ssl; # HTTPS workaround while SG 443 is closed
    listen [::]:18080 ssl;

    ssl_certificate /etc/letsencrypt/live/zx.xingmaierp.cc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zx.xingmaierp.cc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
