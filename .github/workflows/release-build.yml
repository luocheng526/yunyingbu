name: Release artifact

on:
  push:
    branches:
      - main

concurrency:
  group: release-artifact-${{ github.sha }}
  cancel-in-progress: false

jobs:
  artifact:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve unique merged PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          json=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main")]')
          count=$(echo "$json" | jq 'length')
          if [ "$count" != "1" ]; then
            echo "expected exactly one merged PR for this SHA, got $count"
            exit 1
          fi
          echo "number=$(echo "$json" | jq -r '.[0].number')" >> "$GITHUB_OUTPUT"
          echo "source=$(echo "$json" | jq -r '.[0].head.sha')" >> "$GITHUB_OUTPUT"

      - name: Build immutable triple
        env:
          RELEASE_PR_NUMBER: ${{ steps.pr.outputs.number }}
          RELEASE_SOURCE_SHA: ${{ steps.pr.outputs.source }}
          RELEASE_TREE_SHA: ${{ github.sha }}
        run: node scripts/release/build-artifact.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: release-triple
          path: dist/release/artifact.*
          if-no-files-found: error
          overwrite: false
